    const lats = {'C':-80,'D':-72,'E':-64,'F':-56,'G':-48,'H':-40,'J':-32,'K':-24,'L':-16,'M':-8,'N':0,'P':8,'Q':16,'R':24,'S':32,'T':40,'U':48,'V':56,'W':64,'X':72};
    const lat = lats[band] || 0;
    return lat < 0 ? 10000000.0 + (lat * 111000.0) : lat * 111000.0;
  }

  function mgrsToUtm(mgrsStr) {
    const clean = mgrsStr.replace(/\s+/g, '').toUpperCase();
    const m = clean.match(/^(\d{1,2})([C-X])([A-Z]{2})(\d+)$/);
    if (!m) throw new Error("Chybný MGRS formát");
    const zone = parseInt(m[1], 10), band = m[2], sqId = m[3], digits = m[4];
    if (digits.length % 2 !== 0) throw new Error("MGRS musí mať párny počet číslic");
    const half = digits.length / 2;
    const eVal = parseFloat(digits.substring(0, half)) * Math.pow(10, 5 - half);
    const nVal = parseFloat(digits.substring(half)) * Math.pow(10, 5 - half);
    const setIdx = (zone - 1) % 3;
    const [eSet, nSet] = SETS_100K[setIdx];
    const eIdx = eSet.indexOf(sqId[0]), nIdx = nSet.indexOf(sqId[1]);
    if (eIdx === -1 || nIdx === -1) throw new Error("Neplatný štvoruholník");
    let n100k = nIdx * 100000.0, minN = getMinN(band);
    while (n100k < minN) n100k += 2000000.0;
    return { e: (eIdx + 1) * 100000.0 + eVal, n: n100k + nVal };
  }

  function formatDielce(val) {
    let d = Math.round(val) % 6000;
    if (d < 0) d += 6000;
    return `${String(Math.floor(d / 100)).padStart(2, '0')}-${String(d % 100).padStart(2, '0')} dc`;
  }

  function interpoluj(table, dist) {
    if (!table || table.length === 0) return null;
    if (dist <= table[0].vzd) return table[0];
    if (dist >= table[table.length - 1].vzd) return table[table.length - 1];

    let p1 = table[0], p2 = table[1];
    for (let i = 0; i < table.length - 1; i++) {
      if (dist >= table[i].vzd && dist <= table[i+1].vzd) {
        p1 = table[i];
        p2 = table[i+1];
        break;
      }
    }

    const t = (dist - p1.vzd) / (p2.vzd - p1.vzd);
    return {
      zam: p1.zam + t * (p2.zam - p1.zam),
      opr: p1.opr + t * (p2.opr - p1.opr),
      zmena: p1.zmena + t * (p2.zmena - p1.zmena),
      cas: p1.cas + t * (p2.cas - p1.cas),
      ypom: p1.ypom + t * (p2.ypom - p1.ypom),
      vVrcholu: p1.vVrcholu + t * (p2.vVrcholu - p1.vVrcholu)
    };
  }

  function vypocitaj() {
    try {
      const hs = parseInt(document.getElementById('hlavnySmer').value, 10);
      const hzb = parseInt(document.getElementById('hzb').value, 10);
      const m1 = document.getElementById('mgrsMoja').value.trim();
      const m2 = document.getElementById('mgrsCiel').value.trim();
      const vyskaPalpost = parseFloat(document.getElementById('vyskaPalpost').value) || 0;
      const vyskaCiel = parseFloat(document.getElementById('vyskaCiel').value) || 0;

      if (isNaN(hs) || isNaN(hzb)) throw new Error("Zadaj Hlavný smer aj HZB");
      const p1 = mgrsToUtm(m1), p2 = mgrsToUtm(m2);
      const dx = p2.e - p1.e, dy = p2.n - p1.n;
      const dist = Math.round(Math.sqrt(dx * dx + dy * dy));
      let deg = Math.atan2(dx, dy) * (180 / Math.PI);
      if (deg < 0) deg += 360.0;
      const smernik = deg * (6000.0 / 360.0);
      const smRound = Math.round(smernik);

      let napln = "";
      const validNaplne = [];
      for (const [k, tab] of Object.entries(BALISTICKE_TABULKY)) {
        const minV = tab[0].vzd;
        const maxV = tab[tab.length - 1].vzd;
        if (dist >= minV && dist <= maxV) {
          validNaplne.push({ name: k, tab: tab, diff: Math.abs((minV + maxV)/2 - dist) });
        }
      }

      if (validNaplne.length > 0) {
        validNaplne.sort((a, b) => a.diff - b.diff);
        napln = validNaplne[0].name;
      } else {
        const fallbackMap = { "Náplň 1": 865.5, "Náplň 2": 1520.0, "Náplň 3": 2218.0, "Náplň 4": 2874.0, "Náplň 5": 3408.0, "Náplň 6": 3901.0, "Náplň D": 4719.0 };
        let minD = Infinity;
        for (const [k, v] of Object.entries(fallbackMap)) {
          if (Math.abs(v - dist) < minD) { minD = Math.abs(v - dist); napln = k; }
        }
      }

      let tabData = null;
      if (BALISTICKE_TABULKY[napln]) {
        tabData = interpoluj(BALISTICKE_TABULKY[napln], dist);
      }

      if (tabData) {
        const prevysenie = vyskaCiel - vyskaPalpost;
        const korekciaPrevysenia = (prevysenie / 10.0) * tabData.opr;
        const upravenaDiaľkaZam = tabData.zam + korekciaPrevysenia;
        
        let zam = (hs >= smRound) ? (upravenaDiaľkaZam - (hs - smRound)) : (upravenaDiaľkaZam + (smRound - hs));

        document.getElementById('resSmernik').innerText = formatDielce(smernik);
        document.getElementById('resVzdialenost').innerText = dist + " m";
        document.getElementById('resNapln').innerText = napln;
        document.getElementById('resZameriavac').innerText = formatDielce(zam);
        document.getElementById('resDiaľkaZam').innerText = Math.round(upravenaDiaľkaZam * 10) / 10 + " dielcov";
        document.getElementById('resZmena').innerText = Math.round(tabData.zmena * 10) / 10;
        document.getElementById('resDobaLetu').innerText = Math.round(tabData.cas * 10) / 10 + " s";
        document.getElementById('resVyskaVrcholu').innerText = Math.round(vyskaPalpost + tabData.vVrcholu) + " m n.m.";
      } else {
        let zam = (hs >= smRound) ? (hzb - (hs - smRound)) : (hzb + (smRound - hs));
        document.getElementById('resSmernik').innerText = formatDielce(smernik);
        document.getElementById('resVzdialenost').innerText = dist + " m";
        document.getElementById('resNapln').innerText = napln;
        document.getElementById('resZameriavac').innerText = formatDielce(zam);
        document.getElementById('resDiaľkaZam').innerText = "-";
        document.getElementById('resZmena').innerText = "-";
        document.getElementById('resDobaLetu').innerText = "-";
        document.getElementById('resVyskaVrcholu').innerText = "-";
      }

    } catch (e) { alert(e.message); }
  }
</script>
