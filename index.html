<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2. HGÚ BALISTIKA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="ikona.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">
  <style>
    body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
    .container { padding: 20px; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
    input { width: 100%; padding: 10px; margin: 5px 0 10px 0; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2196f3; color: #fff; border: none; border-radius: 5px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; }
    
    /* Úvodná obrazovka (Splash Screen) */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #splash img {
      width: 100vw;
      height: 150vh;
      object-fit: cover;
      border-radius: 0;
    }
  </style>
</head>
<body>

  <!-- Úvodná obrazovka na 2 sekundy -->
  <div id="splash">
    <img src="ikona.png" alt="Ikona">
  </div>

  <div class="container">
    <h2>2. HGÚ - BALISTIKA</h2>

    <div class="card">
      <label>1. Hlavný smer (1-6000)</label>
      <input type="number" id="hlavnySmer">

      <label>2. HZB (1-6000)</label>
      <input type="number" id="hzb">

      <label>3. PALPOST (MGRS)</label>
      <input type="text" id="mgrsMoja">

      <label>PALPOST VÝŠKA N.M.</label>
      <input type="number" id="vyskaPalpost">

      <label>4. CIEĽ (MGRS)</label>
      <input type="text" id="mgrsCiel">

      <label>CIEĽ VÝŠKA N.M.</label>
      <input type="number" id="vyskaCiel">

      <button onclick="vypocitaj()">VYPOČÍTAŤ</button>
    </div>

    <div class="card">
      <div class="row"><span>Smerník:</span><b id="resSmernik">-</b></div>
      <div class="row"><span>Vzdialenosť:</span><b id="resVzdialenost">-</b></div>
      <div class="row"><span>Náplň:</span><b id="resNapln">-</b></div>
      <div class="row"><span>Zameriavač:</span><b id="resZameriavac">-</b></div>
    </div>
  </div>

<script>
  // Schovanie úvodnej obrazovky po 2 sekundách
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const splash = document.getElementById('splash');
      splash.style.opacity = '0';
      setTimeout(() => splash.style.display = 'none', 500);
    }, 2000);
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
  }

  const NAPLNE = { "Náplň 1": 865.5, "Náplň 2": 1520.0, "Náplň 3": 2218.0, "Náplň 4": 2874.0, "Náplň 5": 3408.0, "Náplň 6": 3901.0, "Náplň D": 4719.0 };
  const SETS_100K = [["ABCDEFGH", "ABCDEFGHJKLMNPQRSTUV"], ["JKLMNPQR", "FGHJKLMNPQRSTUVABCDE"], ["STUVWXYZ", "ABCDEFGHJKLMNPQRSTUV"]];

  function getMinN(band) {
    const lats = {'C':-80,'D':-72,'E':-64,'F':-56,'G':-48,'H':-40,'J':-32,'K':-24,'L':-16,'M':-8,'N':0,'P':8,'Q':16,'R':24,'S':32,'T':40,'U':48,'V':56,'W':64,'X':72};
    const lat = lats[band] || 0;
    return lat < 0 ? 10000000.0 + (lat * 111000.0) : lat * 111000.0;
  }

  function mgrsToUtm(mgrsStr) {
    const clean = mgrsStr.replace(/\s+/g, '').toUpperCase();
    const m = clean.match(/^(\d{1,2})([C-X])([A-Z]{2})(\d+)$/);
    if (!m) throw new Error("Chybný MGRS formát");
    const zone = parseInt(m[1], 10), band = m[2], sqId = m[3], digits = m[4];
    if (digits.length % 2 !== 0) throw new Error("MGRS musí mať párny počet číslic");
    const half = digits.length / 2;
    const eVal = parseFloat(digits.substring(0, half)) * Math.pow(10, 5 - half);
    const nVal = parseFloat(digits.substring(half)) * Math.pow(10, 5 - half);
    const setIdx = (zone - 1) % 3;
    const [eSet, nSet] = SETS_100K[setIdx];
    const eIdx = eSet.indexOf(sqId[0]), nIdx = nSet.indexOf(sqId[1]);
    if (eIdx === -1 || nIdx === -1) throw new Error("Neplatný štvoruholník");
    let n100k = nIdx * 100000.0, minN = getMinN(band);
    while (n100k < minN) n100k += 2000000.0;
    return { e: (eIdx + 1) * 100000.0 + eVal, n: n100k + nVal };
  }

  function formatDielce(val) {
    let d = Math.round(val) % 6000;
    if (d < 0) d += 6000;
    return `${String(Math.floor(d / 100)).padStart(2, '0')}-${String(d % 100).padStart(2, '0')} dc`;
  }

  function vypocitaj() {
    try {
      const hs = parseInt(document.getElementById('hlavnySmer').value, 10);
      const hzb = parseInt(document.getElementById('hzb').value, 10);
      const m1 = document.getElementById('mgrsMoja').value.trim();
      const m2 = document.getElementById('mgrsCiel').value.trim();

      if (isNaN(hs) || isNaN(hzb)) throw new Error("Zadaj Hlavný smer aj HZB");
      const p1 = mgrsToUtm(m1), p2 = mgrsToUtm(m2);
      const dx = p2.e - p1.e, dy = p2.n - p1.n;
      const dist = Math.round(Math.sqrt(dx * dx + dy * dy));
      let deg = Math.atan2(dx, dy) * (180 / Math.PI);
      if (deg < 0) deg += 360.0;
      const smernik = deg * (6000.0 / 360.0);
      const smRound = Math.round(smernik);
      let zam = (hs >= smRound) ? (hzb - (hs - smRound)) : (hzb + (smRound - hs));

      let napln = "", minD = Infinity;
      for (const [k, v] of Object.entries(NAPLNE)) {
        if (Math.abs(v - dist) < minD) { minD = Math.abs(v - dist); napln = k; }
      }

      document.getElementById('resSmernik').innerText = formatDielce(smernik);
      document.getElementById('resVzdialenost').innerText = dist + " m";
      document.getElementById('resNapln').innerText = napln;
      document.getElementById('resZameriavac').innerText = formatDielce(zam);
    } catch (e) { alert(e.message); }
  }
</script>
</body>
</html>
