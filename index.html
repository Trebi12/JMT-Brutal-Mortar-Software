<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2. HGÚ BALISTIKA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="ikona.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121212">
  <style>
    body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
    .container { padding: 20px; max-width: 600px; margin: auto; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
    input { width: 100%; padding: 10px; margin: 5px 0 10px 0; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2196f3; color: #fff; border: none; border-radius: 5px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1976d2; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; }
    .row:last-child { border-bottom: none; }
    
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
      box-sizing: border-box;
      padding: 20px;
    }
    #splash img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 15px;
    }
  </style>
</head>
<body>

  <div id="splash">
    <img src="ikona.png" alt="Ikona">
  </div>

  <div class="container">
    <h2>2. HGÚ - BALISTIKA</h2>

    <div class="card">
      <label>1. Hlavný smer (1-6000)</label>
      <input type="number" id="hlavnySmer">

      <label>2. HZB (1-6000)</label>
      <input type="number" id="hzb">

      <label>3. PALPOST (MGRS)</label>
      <input type="text" id="mgrsMoja">

      <label>PALPOST VÝŠKA N.M.</label>
      <input type="number" id="vyskaPalpost">

      <label>4. CIEĽ (MGRS)</label>
      <input type="text" id="mgrsCiel">

      <label>CIEĽ VÝŠKA N.M.</label>
      <input type="number" id="vyskaCiel">

      <button onclick="vypocitaj()">VYPOČÍTAŤ</button>
    </div>

    <div class="card">
      <div class="row"><span>Smerník:</span><b id="resSmernik">-</b></div>
      <div class="row"><span>Vzdialenosť:</span><b id="resVzdialenost">-</b></div>
      <div class="row"><span>Náplň:</span><b id="resNapln">-</b></div>
      <div class="row"><span>Smerník na zameriavači:</span><b id="resZameriavac">-</b></div>
      <div class="row"><span>Diaľka zameriavača (Námer):</span><b id="resDiaľkaZam">-</b></div>
      <div class="row"><span>Doba letu (ToF):</span><b id="resDobaLetu">-</b></div>
      <div class="row"><span>Výška vrcholu (MaxOrd):</span><b id="resVyskaVrcholu">-</b></div>
    </div>
  </div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      const splash = document.getElementById('splash');
      splash.style.opacity = '0';
      setTimeout(() => splash.style.display = 'none', 500);
    }, 2000);
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
  }

  // Balistické tabuľky vz. 97
